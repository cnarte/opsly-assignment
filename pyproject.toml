[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-repo-chat-agent"
version = "0.1.0"
description = "FastAPI Repository Chat Agent - MCP Multi-Agent System"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25,<2",
    "langgraph~=1.1",
    "langgraph-prebuilt",
    "langchain-mcp-adapters",
    "langchain-openrouter~=0.2",
    "langchain-ollama>=0.3",
    "neo4j~=6.1",
    "redis[hiredis]",
    "graphiti-core",
    "fastapi",
    "uvicorn[standard]",
    "httpx>=0.27",
    "libcst",
    "pydantic-settings",
    "langfuse>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]
ui = [
    "streamlit>=1.35",
    "streamlit-agraph>=0.0.45",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
